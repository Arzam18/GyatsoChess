
name: Build GyatsoChess Android ARM64 NEON

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "**/*.nim"
      - "**/*.nims"
      - "**/*.c"
      - "**/*.h"
      - "**/*.cpp"
      - "**/*.nimble"
      - "config.nims"
      - "nim.cfg"

permissions:
  contents: write

jobs:
  build:
    name: Build Android ARM64 NEON
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl unzip xz-utils build-essential

      - name: Install Nim
        run: |
          curl https://nim-lang.org/choosenim/init.sh -sSf \
            | sh -s -- -y
          echo "$HOME/.nimble/bin" >> "$GITHUB_PATH"
          "$HOME/.nimble/bin/choosenim" stable

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Configure Android ARM64 toolchain
        shell: bash
        run: |
          set -eux

          NDK="${{ steps.ndk.outputs.ndk-path }}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CC=$TOOLCHAIN/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "LD=$TOOLCHAIN/bin/ld.lld" >> "$GITHUB_ENV"

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          echo "Nim version:"
          nim --version
          echo "Android compiler:"
          "$CC" --version

      - name: Build Android ARM64 NEON
        shell: bash
        run: |
          set -eux

          # Find the Nim entry point.
          if [ -f main.nim ]; then
            ENTRY="main.nim"
          elif [ -f src/main.nim ]; then
            ENTRY="src/main.nim"
          else
            ENTRY="$(find . -maxdepth 3 -name '*.nim' \
              ! -name '*.nimble' \
              ! -path './.git/*' | head -n 1)"
          fi

          if [ -z "$ENTRY" ] || [ ! -f "$ENTRY" ]; then
            echo "::error::Could not locate a Nim entry-point file."
            exit 1
          fi

          echo "Building entry point: $ENTRY"

          # Use Android's libc and compiler runtime, not Linux librt/libgcc.
          # Nim's GCC backend invokes the NDK Clang compiler.
          nim c \
            --os:android \
            --cpu:arm64 \
            --cc:gcc \
            --gcc.exe:"$CC" \
            --gcc.linkerexe:"$CC" \
            --passC:"-march=armv8-a+simd" \
            --passC:"-mtune=generic" \
            --passL:"-fPIE" \
            --passL:"-pie" \
            --passL:"-Wl,--allow-shlib-undefined" \
            --out:GyatsoChess-android-arm64 \
            "$ENTRY"

          file GyatsoChess-android-arm64

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: GyatsoChess-android-arm64-neon
          path: GyatsoChess-android-arm64
          if-no-files-found: error

      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GyatsoChess-android-arm64
